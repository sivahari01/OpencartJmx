name: Mirror Neotys Maven Releases

on:
  workflow_dispatch:   # Trigger manually

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y wget zip

      - name: Download Entire Releases Repo
        run: |
          mkdir -p neotys-releases
          cd neotys-releases
          wget -r -np -nH --cut-dirs=4 --reject "index.html*" \
            https://maven.neotys.com/content/repositories/releases/

      - name: Create Split Zip (2GB parts)
        run: |
          zip -r -s 2000m neotys-releases.zip neotys-releases

      - name: Upload Split Zips
        uses: actions/upload-artifact@v4
        with:
          name: neotys-maven-releases
          path: neotys-releases.zip*
