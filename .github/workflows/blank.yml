name: Download Neotys Maven Repo

on:
  workflow_dispatch:   # Run manually from GitHub Actions tab
  push:                # Optional - run on push
    branches: [ main ]

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install wget & zip
      run: sudo apt-get update && sudo apt-get install -y wget zip

    - name: Download Neotys Maven Releases
      run: |
        mkdir -p neotys-releases
        cd neotys-releases
        wget -r -nH --cut-dirs=4 --no-parent --reject "index.html*" https://maven.neotys.com/content/repositories/releases/

    - name: Zip Downloaded Repo
      run: |
        zip -r neotys-releases.zip neotys-releases

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neotys-maven-releases
        path: neotys-releases.zip
